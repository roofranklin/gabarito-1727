<header class="cabecalho">
  <div class="container">
    <h1>Minha Loja</h1>
    <nav>
      <span>Início</span>
      <span>Produtos</span>
      <span>Contato</span>
      @if (quantidade() > 0) {
        <span class="carrinho">Carrinho: {{ quantidade() }} itens</span>
        <button type="button" class="btn btn-sm btn-danger ms-2" (click)="esvaziarCarrinho()">Esvaziar</button>
      }
    </nav>
  </div>
</header>
