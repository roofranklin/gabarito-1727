<section class="vitrine-secao">
  <h2 class="vitrine-titulo">Vitrine de Produtos</h2>

  @if (carregando) {
    <p class="mensagem-carregando">Carregando vitrine de produtos...</p>
  } @else {
    <div class="vitrine-grid">
      @for (prod of produtos; track prod.id) {
        <app-product-card [produtoRecebido]="prod" (adicionar)="receberProduto($event)">
        </app-product-card>
      }
    </div>
  }
</section>
